<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>スポット検索 | Sagabai-Map</title>
    <meta name="description" content="佐賀市の観光スポットを検索できます。">

    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/index.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=RocknRoll+One&display=swap" rel="stylesheet">

    <script type="module" src="js/main.js" defer></script>
    <script type="module" src="js/search.js" defer></script>
</head>

<body>
    <header id="site-header">
        <div class="header-left">
            <button
                class="menu-btn"
                id="menuBtn"
                aria-expanded="false"
                aria-controls="menuDropdown"
            >
                <span class="menu-icon"></span>
                <span class="menu-label">MENU</span>
            </button>

            <nav class="menu-dropdown" id="menuDropdown" hidden>
                <ul>
                    <li><a href="index.html">マップを見る</a></li>
                    <li><a href="search.html">スポット検索</a></li>
                    <li><a href="gallery.html">写真ギャラリー</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">お問い合わせ</a></li>
                </ul>
            </nav>
        </div>

        <div class="header-center">
            <h1 class="main-title">Finding-SAGA</h1>
            <p class="sub-main-title">魅力を佐賀市だせ！</p>
        </div>
    </header>

    <main class="search-page">
        <section class="intro" aria-labelledby="page-title">
            <small>Discover Saga</small>
            <h2 id="page-title">スポットを探す</h2>
            <p>キーワードから佐賀市の観光スポットを検索できます。</p>
        </section>

        <section class="search-box" aria-label="スポット検索">
            <form class="search-form" id="search-form" role="search">
                <input
                    id="spot-search-input"
                    type="search"
                    placeholder="スポット名・説明で検索"
                    autocomplete="off"
                >
                <button type="submit">検索する</button>
            </form>

            <p class="search-note">例：気球、観光スポット</p>
        </section>

        <section aria-label="検索結果">
            <div id="spot-search-results" aria-live="polite"></div>
        </section>
    </main>


<footer>
    <p>&copy; 2026 Finding-SAGA</p>
</footer>

</body>
</html>
