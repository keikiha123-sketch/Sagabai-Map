<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>写真ギャラリー | Sagabai-Map</title>
    <meta name="description" content="佐賀の観光スポットの写真を一覧で見られるギャラリーです。">

    <!-- 既存サイト共通のスタイル -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
    <!-- ギャラリー専用のスタイル -->
    <link rel="stylesheet" href="css/gallery.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=RocknRoll+One&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="images/favicons/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="images/favicons/favicon.svg">
    <link rel="shortcut icon" href="images/favicons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/apple-touch-icon.png">

    <!-- 既存のメニュー制御とギャラリー制御 -->
    <script type="module" src="js/main.js" defer></script>
    <script type="module" src="js/gallery.js" defer></script>
</head>
<body>
    <header id="site-header">
        <div class="header-left">
            <button
                class="menu-btn"
                id="menuBtn"
                type="button"
                aria-expanded="false"
                aria-controls="menuDropdown"
            >
                <span class="menu-icon"></span>
                <span class="menu-label">MENU</span>
            </button>

            <nav class="menu-dropdown" id="menuDropdown" hidden>
                <ul>
                    <li><a href="index.html">マップを見る</a></li>
                    <li><a href="search.html">スポット検索</a></li>
                    <li><a href="gallery.html" aria-current="page">写真ギャラリー</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">お問い合わせ</a></li>
                </ul>
            </nav>
        </div>

        <div class="header-center">
            <h1 class="main-title">さがばいまっぷ</h1>
            <p class="sub-main-title">Sagabai-Map</p>
        </div>
    </header>

    <main class="gallery-page">
        <section class="gallery-intro" aria-labelledby="gallery-title">
            <p class="gallery-eyebrow">PHOTO GALLERY</p>
            <h2 id="gallery-title">写真ギャラリー</h2>
            <p>佐賀の景色を、写真でめぐる。</p>
        </section>

        <section class="gallery-controls" aria-label="写真の絞り込み">
            <div class="gallery-filter">
                <label for="spot-filter">スポットで絞り込む</label>
                <select id="spot-filter" name="spot">
                    <option value="all">すべてのスポット</option>
                </select>
            </div>

            <p
                class="gallery-status"
                id="gallery-status"
                aria-live="polite"
            >
                写真を読み込んでいます。
            </p>
        </section>

        <section aria-label="写真一覧">
            <div class="photo-grid" id="photo-grid"></div>
            <p class="gallery-empty" id="gallery-empty" hidden></p>
        </section>
    </main>

    <!-- 写真をクリックしたときだけ表示する詳細画面 -->
    <dialog
        class="photo-dialog"
        id="photo-dialog"
        aria-labelledby="photo-dialog-caption"
    >
        <div class="photo-dialog__inner">
            <button
                class="photo-dialog__close"
                id="photo-dialog-close"
                type="button"
                aria-label="写真を閉じる"
            >
                <span aria-hidden="true">&times;</span>
            </button>

            <div class="photo-dialog__image-wrap">
                <img
                    id="photo-dialog-image"
                    class="photo-dialog__image"
                    alt=""
                >
            </div>

            <div class="photo-dialog__details">
                <p
                    class="photo-dialog__spot"
                    id="photo-dialog-spot"
                ></p>

                <h3
                    class="photo-dialog__caption"
                    id="photo-dialog-caption"
                ></h3>
            </div>
        </div>
    </dialog>
</body>
        <div class="footer-bottom">
            <p class="footer-copyright">
                &copy; 2026 Sagabai Map
            </p>
        </div>
</html>
